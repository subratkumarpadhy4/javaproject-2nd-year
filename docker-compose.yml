services:
  postgres:
    image: postgres:16-alpine
    container_name: verivote-postgres
    restart: always
    environment:
      POSTGRES_DB: verivotedb
      POSTGRES_USER: verivote
      POSTGRES_PASSWORD: verivotesecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verivote -d verivotedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verivote-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: postgresql://verivote:verivotesecretpassword@postgres:5432/verivotedb
      VERIVOTE_HMAC_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      VERIVOTE_LEDGER_PATH: /data/ledger/blocks.ndjson
      VERIVOTE_CHECKPOINT_DIR: /data/ledger/checkpoints
    volumes:
      - ledgerdata:/data

volumes:
  pgdata:
  ledgerdata:
