spring.application.name=verivote-web
server.port=${PORT:8080}
verivote.crypto.hmac-master-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
# Local development: file-backed H2 so voters/ballots survive restarts (alongside the ledger file).
# Override with VERIVOTE_DB_URL, or run with SPRING_PROFILES_ACTIVE=prod + DATABASE_URL for PostgreSQL.
spring.datasource.url=${VERIVOTE_DB_URL:jdbc:h2:file:./data/verivotedb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
verivote.checkpoint.min-external-sinks=1
verivote.checkpoint.min-blocks=1
verivote.checkpoint.min-seconds-with-new-blocks=5
verivote.ledger.path=${VERIVOTE_LEDGER_PATH:./ledger/blocks.ndjson}
verivote.checkpoint.dir=${VERIVOTE_CHECKPOINT_DIR:./ledger/checkpoints}
verivote.tally.key-file=${VERIVOTE_TALLY_KEY_FILE:./data/keys/tally-key.pk8}
# Election officer portal credentials (override in any shared deployment)
verivote.admin.username=${VERIVOTE_ADMIN_USERNAME:admin}
verivote.admin.password=${VERIVOTE_ADMIN_PASSWORD:admin123}
