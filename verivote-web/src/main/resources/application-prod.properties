spring.application.name=verivote-web
server.port=${PORT:8080}
verivote.crypto.hmac-master-key=${VERIVOTE_HMAC_MASTER_KEY:}

# PostgreSQL Database Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Safe Schema Migration Strategy (preserves all tables and records across restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Checkpoint configuration
verivote.checkpoint.min-external-sinks=1
verivote.checkpoint.min-blocks=1
verivote.checkpoint.min-seconds-with-new-blocks=5

# Durable volume paths for Ledger and Checkpoints
# Configured for Railway Persistent Volume mounted at /data or configured via env vars
verivote.ledger.path=${VERIVOTE_LEDGER_PATH:/data/ledger/blocks.ndjson}
verivote.checkpoint.dir=${VERIVOTE_CHECKPOINT_DIR:/data/ledger/checkpoints}
