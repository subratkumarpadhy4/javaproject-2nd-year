spring.application.name=verivote-web
server.port=${PORT:8080}
verivote.crypto.hmac-master-key=${VERIVOTE_HMAC_MASTER_KEY:}

# ============================================================
# PostgreSQL Database Configuration
# Railway injects DATABASE_URL (postgres://...) — we map it here
# so Spring Boot auto-configuration can also find it without
# needing the custom ProductionDatabaseConfig bean to run first.
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Safe Schema Migration Strategy (preserves all tables and records across restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Checkpoint configuration
verivote.checkpoint.min-external-sinks=1
verivote.checkpoint.min-blocks=1
verivote.checkpoint.min-seconds-with-new-blocks=5

# Durable volume paths for Ledger and Checkpoints
# Automatically supports Railway persistent volume mounts via RAILWAY_VOLUME_MOUNT_PATH or /data
verivote.ledger.path=${VERIVOTE_LEDGER_PATH:${RAILWAY_VOLUME_MOUNT_PATH:/data}/ledger/blocks.ndjson}
verivote.checkpoint.dir=${VERIVOTE_CHECKPOINT_DIR:${RAILWAY_VOLUME_MOUNT_PATH:/data}/ledger/checkpoints}
verivote.tally.key-file=${VERIVOTE_TALLY_KEY_FILE:${RAILWAY_VOLUME_MOUNT_PATH:/data}/keys/tally-key.pk8}

# Election officer portal credentials — set VERIVOTE_ADMIN_PASSWORD in the deployment environment
verivote.admin.username=${VERIVOTE_ADMIN_USERNAME:admin}
verivote.admin.password=${VERIVOTE_ADMIN_PASSWORD:admin123}
