verivote.crypto.hmac-master-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
spring.datasource.url=jdbc:h2:mem:verivotedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

verivote.checkpoint.min-external-sinks=1
verivote.checkpoint.interval-seconds=5
verivote.checkpoint.min-blocks=10
verivote.checkpoint.min-seconds-with-new-blocks=60
verivote.checkpoint.external-dir=${user.home}/.verivote/checkpoints
verivote.checkpoint.git-repo=${user.home}/.verivote/git-sink
verivote.checkpoint.ed25519-priv-key=
